<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMK's Cave</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #d1d1d1;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        .rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:transparent;
            animation: rain 3s linear infinite;
            z-index: 0;
        }
        @keyframes rain {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
         {
            text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen relative">
    <div class="rain"></div>
    <header class="text-center mb-8 z-10">
        <h1 class="text-5xl font-bold text-red-600 neon-glow">Welcome to AMK's Cave</h1>
        <p class="text-lg mt-2 italic">In the shadows of the city,idk This is my first project.</p>
    </header>
    <main class="z-10 space-y-4">
        <button onclick="diveIntoGotham()" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-4 rounded transition duration-300 shadow-lg">
            What's your purpose traveller?
        </button>
        <button onclick="answerRiddle()" class="bg-red-800 hover:bg-red-900 text-white font-bold py-2 px-4 rounded transition duration-300 shadow-lg block">
            Answer
        </button>
    </main>
    <script>
        function diveIntoGotham() {
            alert("Riddle me this, Traveller: What lurks in Gotham's shadows? ");
        }

        function answerRiddle() {
            alert("VENGEANCE 🦇");
        }
    </script>
</body>
</html>
